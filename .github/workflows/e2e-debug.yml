# TEMPORARY: posts the e2e failure tail to PR #34, because workflow logs cannot
# be downloaded from the sandbox. Runs against main. Remove before finishing.
name: e2e debug
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
  issues: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: e2e
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log | tail -n 40
      - name: Report the failure tail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### main e2e result'; echo '```'; tail -n 120 e2e.log; echo '```'; } > body.md
          gh issue comment 34 --repo Emigdion13/btcAnalyzerV2 --body-file body.md
