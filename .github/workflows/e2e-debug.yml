# TEMPORARY: reproduces the e2e failure and posts its tail to PR #34, because
# workflow logs cannot be downloaded from the sandbox. Remove before merging.
name: e2e debug
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
  pull-requests: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: e2e
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log | tail -n 60
      - name: Report the failure tail
        if: steps.e2e.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### e2e failure tail on main (pre-existing check)'; echo '```'; tail -n 200 e2e.log; echo '```'; } > body.md
          gh pr comment 34 --repo Emigdion13/btcAnalyzerV2 --body-file body.md
